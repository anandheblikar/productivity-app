[project]
name = "productivity-app"
version = "0.1.0"
description = "A personal evening anti-drift app: one good nudge, then get out of the way."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
]

# Packages that are only needed while developing/testing, not to run the app.
# `uv run` installs these automatically.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Look for tests in the tests/ folder.
testpaths = ["tests"]
